<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Empire HQ — Business Ecosystem</title>
  <meta name="description" content="GrowthBoostAI Empire HQ business management dashboard" />
  <style>
    :root{--ink:#172033;--muted:#697386;--nav:#101827;--nav2:#18243a;--blue:#3974ed;--cyan:#25b7b1;--gold:#f0b35a;--panel:#fff;--bg:#f3f6fb;--line:#e6eaf1;--danger:#dc5668;--green:#34a853}*{box-sizing:border-box}body{margin:0;font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink);background:var(--bg)}button,input,select,textarea{font:inherit}.app{min-height:100vh;display:grid;grid-template-columns:248px minmax(0,1fr)}aside{background:linear-gradient(180deg,var(--nav),var(--nav2));color:#fff;padding:24px 18px;position:sticky;top:0;height:100vh}.brand{display:flex;align-items:center;gap:12px;margin:0 8px 28px}.brand-mark{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,#6f91ff,#27c1b8);display:grid;place-items:center;font-weight:800}.brand strong{display:block}.brand small{color:#9da9be}.nav{display:grid;gap:6px}.nav button{border:0;background:transparent;color:#abb7ca;text-align:left;padding:11px 12px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:10px}.nav button:hover,.nav button.active{background:#27344a;color:#fff}.nav button.active{box-shadow:inset 3px 0 var(--cyan)}.nav-icon{width:20px;text-align:center}.side-footer{position:absolute;bottom:18px;left:18px;right:18px;color:#93a0b4;font-size:12px}.main{min-width:0}.topbar{height:72px;background:#fff;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 28px;position:sticky;top:0;z-index:5}.topbar h1{font-size:20px;margin:0}.actions{display:flex;align-items:center;gap:10px}.icon-btn,.primary-btn,.secondary-btn{border:1px solid var(--line);background:#fff;border-radius:9px;padding:9px 12px;cursor:pointer}.primary-btn{background:var(--blue);border-color:var(--blue);color:#fff}.secondary-btn{color:var(--ink)}.avatar{width:36px;height:36px;border-radius:50%;background:#dce7ff;display:grid;place-items:center;font-weight:700;color:#2d5eb5}.content{padding:26px 28px 40px}.view{display:none}.view.active{display:block}.stats{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:14px;margin-bottom:18px}.card{background:var(--panel);border:1px solid var(--line);border-radius:13px;padding:17px}.stat{position:relative}.stat-label{color:var(--muted);font-size:13px}.stat-value{font-size:25px;font-weight:800;margin:7px 0 4px}.trend{font-size:12px;color:var(--green)}.grid{display:grid;grid-template-columns:minmax(0,1.55fr) minmax(280px,.75fr);gap:18px}.card h2{font-size:16px;margin:0 0 14px}.bar-chart{height:210px;display:flex;align-items:flex-end;gap:14px;padding:10px 8px 24px;border-bottom:1px solid var(--line);position:relative}.bar{flex:1;border-radius:7px 7px 2px 2px;background:linear-gradient(180deg,#668df1,#3c69cc);min-width:18px;position:relative}.bar::after{content:attr(data-label);position:absolute;bottom:-21px;left:50%;transform:translateX(-50%);font-size:11px;color:var(--muted)}.business-list{display:grid;gap:10px}.business{display:grid;grid-template-columns:42px minmax(0,1fr) auto;align-items:center;gap:11px;padding:9px 0}.biz-icon{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;background:#edf3ff}.biz-name{font-weight:700;font-size:14px}.biz-meta{font-size:12px;color:var(--muted);margin-top:3px}.status{font-size:11px;border-radius:20px;padding:5px 8px;background:#eaf7ef;color:#287844}.status.pending{background:#fff4df;color:#9a6820}.toolbar{display:flex;justify-content:space-between;gap:12px;margin-bottom:14px}.search{flex:1;max-width:340px}.search input,.field input,.field select,.field textarea{width:100%;border:1px solid var(--line);border-radius:9px;padding:10px 12px;background:#fff}.table-wrap{overflow:auto}.table{width:100%;border-collapse:collapse}.table th{text-align:left;color:var(--muted);font-size:12px;font-weight:600;border-bottom:1px solid var(--line);padding:10px}.table td{border-bottom:1px solid var(--line);padding:12px 10px;font-size:13px}.table tr:hover td{background:#fbfcfe}.empty{text-align:center;padding:30px;color:var(--muted)}.modal-backdrop{display:none;position:fixed;inset:0;background:rgba(15,23,42,.45);z-index:20;align-items:center;justify-content:center;padding:18px}.modal-backdrop.open{display:flex}.modal{width:min(560px,100%);background:#fff;border-radius:14px;padding:20px;box-shadow:0 20px 60px rgba(15,23,42,.25)}.modal-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:16px}.modal h2{margin:0}.form-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}.field{display:grid;gap:6px}.field.full{grid-column:1/-1}.field label{font-size:12px;font-weight:700}.field textarea{min-height:90px;resize:vertical}.modal-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.toast{position:fixed;right:20px;bottom:20px;background:#172033;color:#fff;padding:12px 16px;border-radius:9px;opacity:0;transform:translateY(10px);transition:.2s;z-index:30}.toast.show{opacity:1;transform:none}.kanban{display:grid;grid-template-columns:repeat(3,minmax(220px,1fr));gap:14px}.kanban-col{background:#edf1f7;border-radius:12px;padding:12px}.kanban-col h3{font-size:13px;margin:2px 4px 10px}.lead{background:#fff;border-radius:9px;padding:11px;margin-bottom:8px;border:1px solid var(--line);cursor:pointer}.lead strong{font-size:13px}.lead p{font-size:12px;color:var(--muted);margin:6px 0}.lead .status{float:right}@media(max-width:1000px){.stats{grid-template-columns:repeat(2,1fr)}.grid{grid-template-columns:1fr}.kanban{grid-template-columns:repeat(3,220px);overflow:auto}}@media(max-width:720px){.app{grid-template-columns:1fr}.side-footer{display:none}aside{height:auto;position:static;padding:12px}.brand{margin:5px 8px 10px}.nav{grid-template-columns:repeat(4,1fr)}.nav button{justify-content:center}.nav button span:last-child{display:none}.main{min-height:calc(100vh - 130px)}.topbar{height:64px;padding:0 16px}.content{padding:18px 16px}.stats{grid-template-columns:1fr 1fr}.form-grid{grid-template-columns:1fr}.topbar h1{font-size:17px}}
  </style>
</head>
<body>
<div class="app">
  <aside>
    <div class="brand"><div class="brand-mark">GH</div><div><strong>GrowthBoost</strong><small>Empire HQ</small></div></div>
    <nav class="nav">
      <button class="active" data-view="dashboard"><span class="nav-icon">⌂</span><span>Dashboard</span></button>
      <button data-view="businesses"><span class="nav-icon">◇</span><span>Businesses</span></button>
      <button data-view="pipeline"><span class="nav-icon">▦</span><span>Pipeline</span></button>
      <button data-view="clients"><span class="nav-icon">♙</span><span>Clients</span></button>
      <button data-view="tasks"><span class="nav-icon">✓</span><span>Tasks</span></button>
    </nav>
    <div class="side-footer">Empire ecosystem<br/>All systems operational</div>
  </aside>
  <main class="main">
    <header class="topbar"><h1 id="pageTitle">Empire Dashboard</h1><div class="actions"><button class="icon-btn" id="notifyBtn">🔔</button><div class="avatar">SH</div></div></header>
    <div class="content">
      <section id="dashboard" class="view active">
        <div class="stats" id="stats"></div>
        <div class="grid"><div class="card"><h2>Revenue Overview</h2><div class="bar-chart" id="chart"></div></div><div class="card"><h2>Seven-Business Ecosystem</h2><div class="business-list" id="businessList"></div></div></div>
      </section>
      <section id="businesses" class="view"><div class="toolbar"><div class="search"><input id="businessSearch" placeholder="Search businesses" /></div><button class="primary-btn" data-add="business">+ Add Business</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>Business</th><th>Category</th><th>Revenue</th><th>Clients</th><th>Status</th></tr></thead><tbody id="businessTable"></tbody></table></div></section>
      <section id="pipeline" class="view"><div class="toolbar"><div></div><button class="primary-btn" data-add="lead">+ Add Lead</button></div><div class="kanban" id="kanban"></div></section>
      <section id="clients" class="view"><div class="toolbar"><div class="search"><input id="clientSearch" placeholder="Search clients" /></div><button class="primary-btn" data-add="client">+ Add Client</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>Client</th><th>Email</th><th>Business</th><th>Value</th><th>Status</th></tr></thead><tbody id="clientTable"></tbody></table></div></section>
      <section id="tasks" class="view"><div class="toolbar"><div class="search"><input id="taskSearch" placeholder="Search tasks" /></div><button class="primary-btn" data-add="task">+ Add Task</button></div><div class="card table-wrap"><table class="table"><thead><tr><th>Task</th><th>Owner</th><th>Due</th><th>Priority</th><th>Status</th></tr></thead><tbody id="taskTable"></tbody></table></div></section>
    </div>
  </main>
</div>
<div class="modal-backdrop" id="modal"><div class="modal"><div class="modal-head"><h2 id="modalTitle">Add</h2><button class="icon-btn" id="closeModal">×</button></div><form id="modalForm"><div class="form-grid" id="formFields"></div><div class="modal-actions"><button type="button" class="secondary-btn" id="cancelModal">Cancel</button><button class="primary-btn" type="submit">Save</button></div></form></div></div><div class="toast" id="toast"></div>
<script>
const defaults={businesses:[{name:'GrowthBoost AI',category:'AI & Automation',revenue:18400,clients:28,status:'Active',icon:'AI'},{name:'Empire Consulting',category:'Business Consulting',revenue:12600,clients:19,status:'Active',icon:'EC'},{name:'Cash Maker Academy',category:'Education',revenue:9200,clients:34,status:'Active',icon:'CM'},{name:'StudioForge',category:'Creative Studio',revenue:7800,clients:16,status:'Active',icon:'SF'},{name:'Legal Foundation',category:'Legal Services',revenue:6900,clients:12,status:'Active',icon:'LF'},{name:'Trust Vault',category:'Finance',revenue:5400,clients:9,status:'Active',icon:'TV'},{name:'Universal Business Group',category:'Enterprise',revenue:11200,clients:21,status:'Active',icon:'UB'}],clients:[{name:'Northstar Industries',email:'hello@northstar.example',business:'GrowthBoost AI',value:4800,status:'Active'},{name:'Blue Harbor Co.',email:'team@blueharbor.example',business:'Empire Consulting',value:3200,status:'Active'},{name:'Summit Works',email:'ops@summit.example',business:'StudioForge',value:2100,status:'Pending'}],tasks:[{task:'Send enterprise proposal',owner:'Shauna',due:'2026-11-22',priority:'High',status:'In progress'},{task:'Review client onboarding',owner:'Operations',due:'2026-11-24',priority:'Medium',status:'Open'}],leads:[{name:'Apex Retail',stage:'New',value:3500,owner:'Sales'},{name:'Nova Health',stage:'New',value:5200,owner:'Sales'},{name:'Redline Logistics',stage:'Qualified',value:6800,owner:'Shauna'},{name:'Brightside Media',stage:'Proposal',value:4400,owner:'Marketing'}]};
const state=JSON.parse(localStorage.getItem('empire-hq-v1')||'null')||defaults;function save(){localStorage.setItem('empire-hq-v1',JSON.stringify(state))}const money=n=>'$'+n.toLocaleString();
function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200)}
function renderStats(){const revenue=state.businesses.reduce((a,b)=>a+b.revenue,0);document.getElementById('stats').innerHTML=`<div class="card stat"><div class="stat-label">Monthly Revenue</div><div class="stat-value">${money(revenue)}</div><div class="trend">↗ 18.4% this month</div></div><div class="card stat"><div class="stat-label">Active Businesses</div><div class="stat-value">${state.businesses.length}</div><div class="trend">All operating</div></div><div class="card stat"><div class="stat-label">Total Clients</div><div class="stat-value">${state.businesses.reduce((a,b)=>a+b.clients,0)}</div><div class="trend">↗ 12.1% growth</div></div><div class="card stat"><div class="stat-label">Open Pipeline</div><div class="stat-value">${money(state.leads.reduce((a,b)=>a+b.value,0))}</div><div class="trend">${state.leads.length} opportunities</div></div>`}
function renderChart(){const vals=[42000,51000,47000,63000,58000,71000,76000];document.getElementById('chart').innerHTML=vals.map((v,i)=>`<div class="bar" style="height:${v/76000*170}px" data-label="${['Jan','Feb','Mar','Apr','May','Jun','Jul'][i]}"></div>`).join('')}
function renderBusinesses(){document.getElementById('businessList').innerHTML=state.businesses.slice(0,7).map(b=>`<div class="business"><div class="biz-icon">${b.icon}</div><div><div class="biz-name">${b.name}</div><div class="biz-meta">${money(b.revenue)} / month</div></div><span class="status">${b.status}</span></div>`).join('');document.getElementById('businessTable').innerHTML=state.businesses.map(b=>`<tr><td><strong>${b.name}</strong></td><td>${b.category}</td><td>${money(b.revenue)}</td><td>${b.clients}</td><td><span class="status">${b.status}</span></td></tr>`).join('')}
function renderClients(){document.getElementById('clientTable').innerHTML=state.clients.map(c=>`<tr><td><strong>${c.name}</strong></td><td>${c.email}</td><td>${c.business}</td><td>${money(c.value)}</td><td><span class="status ${c.status==='Pending'?'pending':''}">${c.status}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No clients found</td></tr>'}
function renderTasks(){document.getElementById('taskTable').innerHTML=state.tasks.map(t=>`<tr><td><strong>${t.task}</strong></td><td>${t.owner}</td><td>${t.due}</td><td>${t.priority}</td><td><span class="status ${t.status==='Open'?'pending':''}">${t.status}</span></td></tr>`).join('')||'<tr><td colspan="5" class="empty">No tasks found</td></tr>'}
function renderKanban(){const stages=['New','Qualified','Proposal','Won'];const filtered=state.leads;document.getElementById('kanban').innerHTML=stages.map(stage=>`<div class="kanban-col"><h3>${stage} · ${filtered.filter(l=>l.stage===stage).length}</h3>${filtered.filter(l=>l.stage===stage).map(l=>`<div class="lead"><span class="status">${money(l.value)}</span><strong>${l.name}</strong><p>${l.owner}</p></div>`).join('')}</div>`).join('')}
function renderAll(){renderStats();renderChart();renderBusinesses();renderClients();renderTasks();renderKanban()}
document.querySelectorAll('.nav button').forEach(btn=>btn.addEventListener('click',()=>{document.querySelectorAll('.nav button').forEach(b=>b.classList.remove('active'));btn.classList.add('active');document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));document.getElementById(btn.dataset.view).classList.add('active');document.getElementById('pageTitle').textContent=btn.textContent.trim().replace('Dashboard','Empire Dashboard')}));
const modal=document.getElementById('modal'),fields=document.getElementById('formFields'),form=document.getElementById('modalForm'),titles={business:'Add Business',lead:'Add Lead',client:'Add Client',task:'Add Task'};let addType='';
const field=(name,label,type='text',opts='')=>`<div class="field ${name==='description'?'full':''}"><label>${label}</label>${opts?`<select name="${name}">${opts}</select>`:type==='textarea'?`<textarea name="${name}" required></textarea>`:`<input name="${name}" type="${type}" required />`}</div>`;
document.querySelectorAll('[data-add]').forEach(b=>b.addEventListener('click',()=>openModal(b.dataset.add)));function openModal(type){addType=type;document.getElementById('modalTitle').textContent=titles[type];fields.innerHTML={business:[field('name','Business name'),field('category','Category'),field('revenue','Monthly revenue','number'),field('clients','Client count','number'),field('status','Status','', '<option>Active</option><option>Pending</option>')].join('').replace('description',''),lead:[field('name','Lead name'),field('stage','Stage','', '<option>New</option><option>Qualified</option><option>Proposal</option><option>Won</option>'),field('value','Estimated value','number'),field('owner','Owner')].join(''),client:[field('name','Client name'),field('email','Email','email'),field('business','Business'),field('value','Contract value','number'),field('status','Status','', '<option>Active</option><option>Pending</option>')].join(''),task:[field('task','Task name'),field('owner','Owner'),field('due','Due date','date'),field('priority','Priority','', '<option>High</option><option>Medium</option><option>Low</option>'),field('status','Status','', '<option>Open</option><option>In progress</option><option>Complete</option>')].join('')}[type];modal.classList.add('open')}
function closeModal(){modal.classList.remove('open');form.reset()}document.getElementById('closeModal').onclick=document.getElementById('cancelModal').onclick=closeModal;modal.addEventListener('click',e=>{if(e.target===modal)closeModal()});
form.addEventListener('submit',e=>{e.preventDefault();const data=Object.fromEntries(new FormData(form).entries());if(addType==='business'){data.revenue=Number(data.revenue);data.clients=Number(data.clients);data.icon=data.name.split(/\s+/).map(x=>x[0]).join('').slice(0,2).toUpperCase();state.businesses.push(data)}if(addType==='lead'){data.value=Number(data.value);state.leads.push(data)}if(addType==='client'){data.value=Number(data.value);state.clients.push(data)}if(addType==='task')state.tasks.push(data);save();renderAll();closeModal();toast(titles[addType].replace('Add ','')+' added')});
document.getElementById('notifyBtn').onclick=()=>toast('You’re all caught up');
function filterTable(inputId,tbodyId,columnCheck){document.getElementById(inputId).addEventListener('input',e=>{const q=e.target.value.toLowerCase();Array.from(document.getElementById(tbodyId).rows).forEach(row=>row.style.display=row.textContent.toLowerCase().includes(q)?'':'none')})}filterTable('businessSearch','businessTable');filterTable('clientSearch','clientTable');filterTable('taskSearch','taskTable');
renderAll();
</script>
</body>
</html>
